name: book_app
description: "A polished cross-platform reading app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.2
  archive: ^4.0.7
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.39
  xml: ^6.5.0

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name_android: sqlite
      name: sqlite3
